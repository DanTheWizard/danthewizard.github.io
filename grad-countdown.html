<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Countdown</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  /* scales by width for consistent proportions */
  #countdown-container {
    position: relative;
    width: min(90vw, 700px);
    aspect-ratio: 1 / 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .cap {
    width: 100%;
    height: auto;
    fill: #5A2D81;
    transform: scaleX(-1);
  }

  #timer {
    position: absolute;
    top: 37%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    text-align: center;
    display: flex;
    gap: clamp(1rem, 4vw, 4rem);
    pointer-events: none;
  }

  /* each column for day/hour/min */
  .time-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .time-value {
    font-size: clamp(1.4rem, 4vw, 3rem);
    font-weight: 700;
  }

  .time-label {
    font-size: clamp(0.7rem, 1.2vw, 1.1rem);
    font-weight: 600;
    color: white;
    margin-top: 0.3em;
  }

  #label {
    position: absolute;
    bottom: 2%;
    left: 50%;
    transform: translateX(-50%);
    color: #5A2D81;
    font-weight: 600;
    font-size: clamp(0.8rem, 1.3vw, 1.4rem);
  }
</style>
</head>
<body>

  <div id="countdown-container">
    <!-- purple flipped hat -->
    <svg class="cap" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <g id="Graduation">
        <polygon points="445.055 384.794 445.055 221.864 418.805 234.989 418.805 384.777 401.301 429.785 462.551 429.785 445.055 384.794"/>
        <path d="M229.0648,306.3708l-107.7643-53.88v53.7754c0,36.2433,58.7634,65.625,131.25,65.625,72.4887,0,131.25-29.3817,131.25-65.625V252.49L276.0277,306.3741C257.5813,313.681,247.5133,313.6789,229.0648,306.3708Z"/>
        <path d="M264.2912,282.8969l186.5207-93.26c6.4579-3.2289,6.4579-8.5107,0-11.74l-186.5207-93.26c-6.4556-3.2289-17.0214-3.2289-23.4793,0l-186.5207,93.26c-6.4556,3.2289-6.4556,8.5107,0,11.74l186.5207,93.26C247.27,286.1258,257.8356,286.1258,264.2912,282.8969Z"/>
      </g>
    </svg>

    <!-- centered timer columns -->
    <div id="timer">
      <div class="time-group">
        <div class="time-value" id="days">--</div>
        <div class="time-label">DAYS</div>
      </div>
      <div class="time-group">
        <div class="time-value" id="hours">--</div>
        <div class="time-label">HOURS</div>
      </div>
      <div class="time-group">
        <div class="time-value" id="minutes">--</div>
        <div class="time-label">MIN</div>
      </div>
    </div>

    <div id="label">Graduation Countdown</div>
  </div>

<script>
  function updateCountdown() {
    const target = new Date("Jun 11, 2026 15:00:00 GMT").getTime();
    const now = new Date().getTime();
    const diff = target - now;

    if (diff <= 0) {
      document.getElementById("days").textContent = "🎓";
      document.getElementById("hours").textContent = "";
      document.getElementById("minutes").textContent = "";
      document.getElementById("label").textContent = "It's Graduation Day!";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours.toString().padStart(2, "0");
    document.getElementById("minutes").textContent = minutes.toString().padStart(2, "0");
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();
</script>

</body>
</html>
